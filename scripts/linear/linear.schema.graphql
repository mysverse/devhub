schema {
  query: Query
}

scalar DateTime

type Query {
  issues(first: Int, filter: IssueFilter): IssueConnection!
  team(id: String!): Team
}

type IssueConnection {
  nodes: [Issue!]!
}

type Issue {
  id: ID!
  identifier: String!
  title: String!
  url: String!
  description: String
  estimate: Float
  createdAt: DateTime
  updatedAt: DateTime
  state: WorkflowState
  assignee: User
  labels(first: Int): IssueLabelConnection!
  project: Project
  team: Team
  children(first: Int): IssueConnection!
  comments(first: Int): CommentConnection!
  history(first: Int): IssueHistoryConnection!
}

type WorkflowState {
  id: ID!
  name: String!
  type: String!
}

type User {
  id: ID!
  email: String
  name: String
  displayName: String
  avatarUrl: String
}

type IssueLabelConnection {
  nodes: [IssueLabel!]!
}

type IssueLabel {
  name: String!
}

type Project {
  id: ID!
  name: String!
  startDate: String
  targetDate: String
  progress: Float
  health: String
}

type Team {
  id: ID!
  name: String!
  key: String!
  states(first: Int): WorkflowStateConnection!
}

type WorkflowStateConnection {
  nodes: [WorkflowState!]!
}

type CommentConnection {
  nodes: [Comment!]!
}

type Comment {
  id: ID!
  body: String
  url: String
  createdAt: DateTime
  updatedAt: DateTime
  editedAt: DateTime
  user: User
}

type IssueHistoryConnection {
  nodes: [IssueHistory!]!
}

type IssueHistory {
  actorId: ID
  toAssigneeId: ID
  fromAssigneeId: ID
  toStateId: ID
  fromStateId: ID
  createdAt: DateTime
}

input IssueFilter {
  labels: IssueLabelFilter
  assignee: NullableUserFilter
  state: WorkflowStateFilter
  id: IDComparator
}

input IssueLabelFilter {
  name: StringComparator
}

input NullableUserFilter {
  null: Boolean
  id: IDComparator
}

input WorkflowStateFilter {
  type: StringComparator
}

input StringComparator {
  eq: String
  in: [String!]
  nin: [String!]
}

input IDComparator {
  eq: ID
  in: [ID!]
}
