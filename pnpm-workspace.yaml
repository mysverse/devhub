allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

overrides:
  kysely: 0.28.17

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - '@clerk/shared'
  - '@prisma/engines'
  - prisma

# pnpm's minimumReleaseAge cooldown matches these as package-name patterns,
# NOT name@version — a version suffix matches nothing, so freshly-published
# trusted deps would still be blocked. Keep entries as bare names / scope globs.
minimumReleaseAgeExclude:
  - '@better-auth/*'
  - '@better-fetch/*'
  - '@biomejs/*'
  - '@mantine/*'
  - '@react-email/*'
  - '@tailwindcss/*'
  - better-auth
  - lucide-react
  - react-email
  - tailwindcss
